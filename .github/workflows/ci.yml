name: ci
on:
    push:
    pull_request: 

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: hent kode
              uses: actions/checkout@v7

            - name: Sett opp node
              uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: npm


            - name: installer avhengigheter
              run: npm ci
            - name: kjoer test
              run: npm test
